version: '3'

services:
  nginx:
    # win/linux
#    image: nginx:1.21

    # mac
    image: redis/redis-arm64:7.0

    container_name: local-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../config/nginx/conf.d:/etc/nginx/conf.d
      - ../www:/usr/share/nginx/html
      - nginx-logs:/var/log/nginx
    networks:
      - dev-network

volumes:
  nginx-logs:

networks:
  dev-network: