services:
  portainer:
    image: portainer/portainer-ce:2.9.3
    container_name: local-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - dev-network

volumes:
  portainer-data:

networks:
  dev-network: