# Redis配置文件

# 基础设置
port 6379
bind 0.0.0.0
protected-mode yes
# requirepass redis123  # 注释掉密码设置以匹配项目配置
daemonize no

# 内存设置
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化设置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB持久化
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# 日志设置
loglevel notice
logfile ""

# 连接设置
timeout 0
tcp-keepalive 300
databases 16

# 其他设置
stop-writes-on-bgsave-error yes
lua-time-limit 5000